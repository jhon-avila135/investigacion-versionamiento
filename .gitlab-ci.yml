stages: [validate, deploy]

validate:
  stage: validate
  image: node:22-alpine
  script:
    - npx --yes html-validate "public/**/*.html"

pages:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache tzdata
    - |
      FECHA=$(TZ=America/Guayaquil date +"%Y-%m-%d %H:%M")
      sed -i \
        -e "s|__VERSION__|$CI_COMMIT_SHORT_SHA|g" \
        -e "s|__PLATAFORMA__|GitLab Pages|g" \
        -e "s|__ENTORNO__|${ENTORNO:-sin definir}|g" \
        -e "s|__FECHA__|$FECHA|g" \
        public/*.html
  artifacts:
    paths:
      - public
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
