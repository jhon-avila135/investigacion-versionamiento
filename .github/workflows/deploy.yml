name: Validar y desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar HTML
        run: npx --yes html-validate "public/**/*.html"

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar variables de despliegue
        env:
          ENTORNO: ${{ vars.ENTORNO }}
        run: |
          FECHA=$(TZ=America/Guayaquil date +"%Y-%m-%d %H:%M")
          sed -i \
            -e "s|__VERSION__|${GITHUB_SHA::7}|g" \
            -e "s|__PLATAFORMA__|GitHub Pages|g" \
            -e "s|__ENTORNO__|${ENTORNO:-sin definir}|g" \
            -e "s|__FECHA__|$FECHA|g" \
            public/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
